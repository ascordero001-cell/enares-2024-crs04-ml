name: App CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app-quality:
    name: App quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check src app tests

      - name: Mypy
        run: mypy --config-file mypy.ini src app tests

      - name: Pytest
        run: python -m pytest -q

  docker-build:
    name: App image build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build image without publishing
        run: docker build --tag enares-stage04:app-ci .

  accessibility:
    name: WCAG 2.2 AA
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-runtime.txt

      - name: Install application dependencies
        run: python -m pip install -r requirements-runtime.txt

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install accessibility dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify accessibility residual control
        run: npm run test:a11y-control

      - name: Start application
        run: |
          python -m streamlit run app/streamlit_app.py \
            --server.headless=true \
            --server.address=127.0.0.1 \
            --server.port=8501 > /tmp/enares-streamlit.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/enares-streamlit.log
          exit 1

      - name: Audit WCAG 2.2 AA
        run: npm run test:a11y

      - name: Exercise six concurrent browser sessions
        run: npm run test:six-sessions
