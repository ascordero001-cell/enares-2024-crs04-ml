name: Stage 04 shadow preparation

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Approved release identity
        required: true
        type: string
      run_id:
        description: Approved run identity
        required: true
        type: string
      aggregate_sha256:
        description: SHA-256 of the manually authorized aggregate
        required: true
        type: string
      manifest_sha256:
        description: SHA-256 of the matching manifest
        required: true
        type: string
      parent_sha256:
        description: SHA-256 of the approved V0 parent
        required: true
        type: string
      expected_row_count:
        description: Approved aggregate row count
        required: true
        type: number
      expected_indicator_count:
        description: Approved distinct indicator count
        required: true
        type: number
      decision_reference:
        description: Immutable GitHub review or decision URL
        required: true
        type: string
      decision_commit:
        description: Full commit SHA containing the decision record
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare-private-input:
    name: Verify manually staged private aggregate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact requested commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Require an ephemeral per-run input
        shell: bash
        run: |
          set -euo pipefail
          input_dir="${RUNNER_TEMP}/stage04-private-input"
          test -f "${input_dir}/aggregate.csv" || {
            echo "::error::No authorized per-run aggregate was staged. workflow_dispatch has no native file input; no fallback transport is permitted."
            exit 1
          }
          test -f "${input_dir}/manifest.json" || {
            echo "::error::No matching per-run manifest was staged."
            exit 1
          }

      - name: Build immutable run contract
        shell: bash
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          RUN_ID: ${{ inputs.run_id }}
          AGGREGATE_SHA256: ${{ inputs.aggregate_sha256 }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          PARENT_SHA256: ${{ inputs.parent_sha256 }}
          EXPECTED_ROW_COUNT: ${{ inputs.expected_row_count }}
          EXPECTED_INDICATOR_COUNT: ${{ inputs.expected_indicator_count }}
          DECISION_REFERENCE: ${{ inputs.decision_reference }}
          DECISION_COMMIT: ${{ inputs.decision_commit }}
        run: |
          [[ "${DECISION_COMMIT}" =~ ^[0-9a-fA-F]{40}$ ]]
          git merge-base --is-ancestor "${DECISION_COMMIT}" "${GITHUB_SHA}"
          git show "${DECISION_COMMIT}:docs/stage04/sprint043_stage2_input_contract.md" \
            | grep --fixed-strings -- "${DECISION_REFERENCE}" >/dev/null
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "release_id": os.environ["RELEASE_ID"],
              "run_id": os.environ["RUN_ID"],
              "aggregate_sha256": os.environ["AGGREGATE_SHA256"],
              "manifest_sha256": os.environ["MANIFEST_SHA256"],
              "parent_sha256": os.environ["PARENT_SHA256"],
              "expected_row_count": int(os.environ["EXPECTED_ROW_COUNT"]),
              "expected_indicator_count": int(os.environ["EXPECTED_INDICATOR_COUNT"]),
              "decision_reference": os.environ["DECISION_REFERENCE"],
              "decision_commit": os.environ["DECISION_COMMIT"],
          }
          target = Path(os.environ["RUNNER_TEMP"]) / "stage04-run-contract.json"
          target.write_text(json.dumps(payload), encoding="utf-8")
          PY

      - name: Verify provenance and row contracts
        env:
          PYTHONPATH: src
        run: |
          python scripts/prepare_stage04_shadow_run.py \
            --contract "${RUNNER_TEMP}/stage04-run-contract.json" \
            --aggregate "${RUNNER_TEMP}/stage04-private-input/aggregate.csv" \
            --manifest "${RUNNER_TEMP}/stage04-private-input/manifest.json" \
            --approval-registry docs/stage04/v0_drive_hash_manifest.md \
            --output-directory "${RUNNER_TEMP}/stage04-safe-evidence"

      - name: Upload redacted evidence only
        uses: actions/upload-artifact@v4
        with:
          name: stage04-preparation-${{ github.run_id }}
          path: ${{ runner.temp }}/stage04-safe-evidence/
          retention-days: 7
          if-no-files-found: error

      - name: Confirm stop before cloud mutation
        run: echo "Prepared evidence only; no load, query, promotion, IAM, traffic or publication."
