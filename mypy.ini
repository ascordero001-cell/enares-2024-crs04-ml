[mypy]
python_version = 3.12
mypy_path = src
follow_imports = normal
disable_error_code = import-untyped
check_untyped_defs = True
no_implicit_optional = True
warn_unused_ignores = True

[mypy-enares.stage04.repository]
disallow_untyped_defs = True

[mypy-enares.stage04.repository_cache]
disallow_untyped_defs = True

# Legacy Stage 03 generator scripts are reached indirectly by tests. Their 22 current
# errors are outside this Stage 04 gate, so their imports remain intentionally unchecked.
# Cross-module checking stays enabled for src, app and tests, including repository,
# validation and view_model.
[mypy-scripts.*]
follow_imports = skip
