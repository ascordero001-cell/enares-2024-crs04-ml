name: Authenticated shadow cloud image

on:
  pull_request:
    paths:
      - Dockerfile.cloud
      - .streamlit/config.toml
      - requirements-cloud-runtime.txt
      - requirements-runtime.txt
      - app/streamlit_app.py
      - app/ui_redesign_app.py
      - app/assets/**
      - app/config/**
      - app/views/**
      - src/enares/stage04/**
      - scripts/container_healthcheck.py
      - app/data/v0_authorized_full_indicator_estimates.manifest.json
      - docs/stage04/v0_drive_hash_manifest.md
      - .github/workflows/cloud-image.yml
  push:
    branches: [main]
    paths:
      - Dockerfile.cloud
      - .streamlit/config.toml
      - requirements-cloud-runtime.txt
      - requirements-runtime.txt
      - app/streamlit_app.py
      - app/ui_redesign_app.py
      - app/assets/**
      - app/config/**
      - app/views/**
      - src/enares/stage04/**
      - scripts/container_healthcheck.py
      - app/data/v0_authorized_full_indicator_estimates.manifest.json
      - docs/stage04/v0_drive_hash_manifest.md
      - .github/workflows/cloud-image.yml

permissions:
  contents: read

jobs:
  build-smoke-export:
    name: Build and inspect authenticated shadow image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build cloud image
        run: docker build --file Dockerfile.cloud --tag enares-stage04-cloud:${GITHUB_SHA} .

      - name: Prove aggregate-only image boundary
        run: |
          docker run --rm enares-stage04-cloud:${GITHUB_SHA} sh -eu -c '
            test ! -e /app/app/data/v0_authorized_full_indicator_estimates.csv
            test ! -e /app/app/data/demo_indicator_estimates.csv
            test ! -e /app/data
            ! find /app -type f \( -name "*.sav" -o -name "*.csv" \) ! -path /app/src/enares/stage04/report_topic_map.csv | grep -q .
            test -f /app/src/enares/stage04/report_topic_map.csv
            test -f /app/app/assets/stage04_mockup.css
            test "${STAGE04_UI_TEST_INJECT_SUPPRESSED:-}" = ""
            python -c "import google.cloud.bigquery, streamlit; assert streamlit.__version__ == \"1.64.0\""
            python -c "import app.streamlit_app, app.ui_redesign_app; assert callable(app.streamlit_app.render)"
            python -c "from streamlit import config; assert config.get_option(\"theme.primaryColor\") == \"#0E7C6B\"; assert config.get_option(\"theme.backgroundColor\") == \"#F1F4F9\"; assert config.get_option(\"theme.secondaryBackgroundColor\") == \"#EAEFF6\"; assert config.get_option(\"theme.textColor\") == \"#16202E\""
          '

      - name: Start cloud image with non-secret placeholder configuration
        run: >-
          docker run --detach --name enares-stage04-cloud-ci --publish 8080:8080
          --env STAGE04_BQ_TABLE_FQN=placeholder-project.shadow_published.v_dashboard_current
          --env STAGE04_RELEASE_ID=placeholder-release
          --env STAGE04_RUN_ID=placeholder-run
          enares-stage04-cloud:${GITHUB_SHA}

      - name: Verify health
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/_stcore/health | grep --quiet '^ok$'; then
              exit 0
            fi
            sleep 2
          done
          docker logs enares-stage04-cloud-ci
          exit 1

      - name: Export image archive for controlled deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save enares-stage04-cloud:${GITHUB_SHA} | gzip -1 > enares-stage04-cloud.tar.gz

      - name: Upload short-lived image archive
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: enares-stage04-cloud-${{ github.sha }}
          path: enares-stage04-cloud.tar.gz
          retention-days: 1
          if-no-files-found: error

      - name: Stop cloud image
        if: always()
        run: docker rm --force enares-stage04-cloud-ci || true
