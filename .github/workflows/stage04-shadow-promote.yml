name: Stage 04 authenticated shadow promotion

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Reconciled release identity
        required: true
        type: string
      run_id:
        description: Reconciled run identity
        required: true
        type: string
      source_hash:
        description: Approved V0 parent SHA-256
        required: true
        type: string
      reconciliation_run_url:
        description: Successful protected reconciliation run URL
        required: true
        type: string
      decision_commit:
        description: Full commit SHA containing the reviewed promotion decision
        required: true
        type: string
      decision_path:
        description: Decision JSON below docs/stage04/decisions
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: stage04-shadow-promotion
  cancel-in-progress: false

jobs:
  promote-authenticated-shadow:
    name: Promote approved snapshot and verify authenticated runtime
    if: github.ref == 'refs/heads/main'
    environment:
      name: stage04-shadow-mutation
    runs-on: [self-hosted, Windows, X64, stage04-private-input]
    timeout-minutes: 20

    steps:
      - name: Check out exact requested commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-cloud-runtime.txt

      - name: Install cloud runtime dependencies
        run: python -m pip install -r requirements-cloud-runtime.txt

      - name: Verify immutable supervisory decision
        shell: pwsh
        env:
          DECISION_COMMIT: ${{ inputs.decision_commit }}
          DECISION_PATH: ${{ inputs.decision_path }}
        run: |
          if ($env:DECISION_COMMIT -notmatch '^[0-9a-fA-F]{40}$') {
            throw "decision_commit must be a full commit SHA"
          }
          if ($env:DECISION_PATH -notmatch '^docs/stage04/decisions/[A-Za-z0-9_.-]+\.json$') {
            throw "decision_path is outside the protected decision directory"
          }
          git merge-base --is-ancestor $env:DECISION_COMMIT $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) {
            throw "decision_commit is not an ancestor of the dispatched commit"
          }
          $target = Join-Path $env:RUNNER_TEMP "stage04-promotion-decision.json"
          git show "$($env:DECISION_COMMIT):$($env:DECISION_PATH)" | `
            Out-File -LiteralPath $target -Encoding utf8

      - name: Promote reconciled BigQuery snapshot
        env:
          PYTHONPATH: src
          RELEASE_ID: ${{ inputs.release_id }}
          RUN_ID: ${{ inputs.run_id }}
          SOURCE_HASH: ${{ inputs.source_hash }}
          RECONCILIATION_RUN_URL: ${{ inputs.reconciliation_run_url }}
          DECISION_COMMIT: ${{ inputs.decision_commit }}
          DECISION_PATH: ${{ inputs.decision_path }}
        run: |
          $decisionReference = "https://github.com/$env:GITHUB_REPOSITORY/blob/$env:DECISION_COMMIT/$env:DECISION_PATH"
          python scripts/promote_stage04_shadow.py `
            --decision (Join-Path $env:RUNNER_TEMP "stage04-promotion-decision.json") `
            --decision-reference $decisionReference `
            --release-id $env:RELEASE_ID `
            --run-id $env:RUN_ID `
            --source-hash $env:SOURCE_HASH `
            --reconciliation-run-url $env:RECONCILIATION_RUN_URL `
            --output (Join-Path $env:RUNNER_TEMP "stage04-promotion-evidence/bigquery.json")

      - name: Create no-traffic authenticated candidate revision
        shell: pwsh
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          $project = "enares-2024-crs04"
          $region = "us-central1"
          $service = "enares-stage04-shadow"
          $published = "$project.enares2024_crs04_stage04_shadow_published.v_dashboard_current"
          $serviceJson = gcloud run services describe $service --project $project --region $region --format=json | ConvertFrom-Json
          $policy = gcloud run services get-iam-policy $service --project $project --region $region --format=json | ConvertFrom-Json
          $members = @($policy.bindings | ForEach-Object { $_.members })
          if ($members -contains "allUsers" -or $members -contains "allAuthenticatedUsers") {
            throw "Cloud Run service has a public principal"
          }
          $image = [string]$serviceJson.spec.template.spec.containers[0].image
          if ($image -notmatch '@sha256:[0-9a-f]{64}$') {
            throw "Cloud Run image is not pinned by digest"
          }
          $tag = "candidate-$env:GITHUB_RUN_ID"
          gcloud run services update $service `
            --project $project --region $region --image $image `
            --update-env-vars "STAGE04_DATA_MODE=AUTHENTICATED_SHADOW,STAGE04_BQ_TABLE_FQN=$published,STAGE04_RELEASE_ID=$env:RELEASE_ID,STAGE04_RUN_ID=$env:RUN_ID" `
            --min 0 --max 1 --concurrency 6 --no-traffic --tag $tag --quiet
          if ($LASTEXITCODE -ne 0) { throw "Candidate revision update failed" }
          "STAGE04_CANDIDATE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify candidate health and protected access
        shell: pwsh
        run: |
          $project = "enares-2024-crs04"
          $region = "us-central1"
          $service = "enares-stage04-shadow"
          $serviceJson = gcloud run services describe $service --project $project --region $region --format=json | ConvertFrom-Json
          $candidate = $serviceJson.status.traffic | Where-Object { $_.tag -eq $env:STAGE04_CANDIDATE_TAG }
          if (-not $candidate -or -not $candidate.url) { throw "Candidate tag URL is unavailable" }
          $revisionJson = gcloud run revisions describe $candidate.revisionName `
            --project $project --region $region --format=json | ConvertFrom-Json
          $minimum = $revisionJson.metadata.annotations.'autoscaling.knative.dev/minScale'
          if ($null -ne $minimum -and [string]$minimum -ne "0") {
            throw "Candidate minimum scale is not zero"
          }
          if ([string]$revisionJson.metadata.annotations.'autoscaling.knative.dev/maxScale' -ne "1") {
            throw "Candidate maximum scale is not one"
          }
          if ([int]$revisionJson.spec.containerConcurrency -ne 6) {
            throw "Candidate concurrency is not six"
          }
          $healthUrl = "$($candidate.url)/_stcore/health"
          $anonymous = Invoke-WebRequest -Uri $healthUrl -SkipHttpErrorCheck
          if ($anonymous.StatusCode -ne 403) { throw "Anonymous candidate access is not forbidden" }
          $token = gcloud auth print-identity-token --audiences=$($candidate.url)
          $authenticated = Invoke-WebRequest -Uri $healthUrl -Headers @{ Authorization = "Bearer $token" } -SkipHttpErrorCheck
          if ($authenticated.StatusCode -ne 200 -or $authenticated.Content.Trim() -ne "ok") {
            throw "Authenticated candidate health failed"
          }

      - name: Move traffic to verified candidate
        shell: pwsh
        run: |
          gcloud run services update-traffic enares-stage04-shadow `
            --project enares-2024-crs04 --region us-central1 `
            --to-tags "$env:STAGE04_CANDIDATE_TAG=100" --quiet
          if ($LASTEXITCODE -ne 0) { throw "Traffic promotion failed" }

      - name: Verify final runtime configuration and access
        shell: pwsh
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          $project = "enares-2024-crs04"
          $region = "us-central1"
          $service = "enares-stage04-shadow"
          $serviceJson = gcloud run services describe $service --project $project --region $region --format=json | ConvertFrom-Json
          $activeTraffic = @($serviceJson.status.traffic | Where-Object {
            $_.tag -eq $env:STAGE04_CANDIDATE_TAG -and [int]$_.percent -eq 100
          })
          if ($activeTraffic.Count -ne 1) {
            throw "Verified candidate does not have exactly 100 percent traffic"
          }
          $minimum = $serviceJson.spec.template.metadata.annotations.'autoscaling.knative.dev/minScale'
          if ($null -ne $minimum -and [string]$minimum -ne "0") {
            throw "Cloud Run minimum scale is not zero"
          }
          if ([string]$serviceJson.spec.template.metadata.annotations.'autoscaling.knative.dev/maxScale' -ne "1") {
            throw "Cloud Run max scale is not one"
          }
          if ([int]$serviceJson.spec.template.spec.containerConcurrency -ne 6) {
            throw "Cloud Run concurrency is not six"
          }
          $envMap = @{}
          $serviceJson.spec.template.spec.containers[0].env | ForEach-Object { $envMap[$_.name] = $_.value }
          if ($envMap.STAGE04_RELEASE_ID -ne $env:RELEASE_ID -or $envMap.STAGE04_RUN_ID -ne $env:RUN_ID) {
            throw "Cloud Run release/run does not match the approved decision"
          }
          $policy = gcloud run services get-iam-policy $service --project $project --region $region --format=json | ConvertFrom-Json
          $members = @($policy.bindings | ForEach-Object { $_.members })
          if ($members -contains "allUsers" -or $members -contains "allAuthenticatedUsers") {
            throw "Cloud Run service has a public principal"
          }
          $url = [string]$serviceJson.status.url
          $anonymous = Invoke-WebRequest -Uri "$url/_stcore/health" -SkipHttpErrorCheck
          if ($anonymous.StatusCode -ne 403) { throw "Anonymous service access is not forbidden" }
          $token = gcloud auth print-identity-token --audiences=$url
          $authenticated = Invoke-WebRequest -Uri "$url/_stcore/health" -Headers @{ Authorization = "Bearer $token" } -SkipHttpErrorCheck
          if ($authenticated.StatusCode -ne 200 -or $authenticated.Content.Trim() -ne "ok") {
            throw "Authenticated service health failed"
          }
          $runtimeEvidence = @{
            status = "PASS"
            service = $service
            authenticated_health = 200
            anonymous_access = 403
            min_instances = 0
            max_instances = 1
            concurrency = 6
            public_principals = 0
            release_id = $env:RELEASE_ID
            run_id = $env:RUN_ID
            institutional_publication = $false
            cutover = $false
          } | ConvertTo-Json
          $target = Join-Path $env:RUNNER_TEMP "stage04-promotion-evidence/runtime.json"
          [IO.File]::WriteAllText($target, $runtimeEvidence, [Text.UTF8Encoding]::new($false))

      - name: Record redacted workflow outcome
        if: always()
        shell: powershell
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          $directory = Join-Path $env:RUNNER_TEMP "stage04-promotion-evidence"
          [IO.Directory]::CreateDirectory($directory) | Out-Null
          $outcome = @{
            status = $env:JOB_STATUS
            github_run_id = $env:GITHUB_RUN_ID
            workflow = "stage04-shadow-promote"
            contains_respondent_data = $false
          } | ConvertTo-Json
          $target = Join-Path $directory "workflow-outcome.json"
          [IO.File]::WriteAllText($target, $outcome, [Text.UTF8Encoding]::new($false))

      - name: Upload redacted promotion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage04-promotion-${{ github.run_id }}
          path: ${{ runner.temp }}/stage04-promotion-evidence/
          retention-days: 7
          if-no-files-found: warn
