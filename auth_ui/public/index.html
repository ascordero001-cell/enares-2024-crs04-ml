<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ENARES · Iniciar sesión</title>
    <style>
      :root { font: 16px system-ui, sans-serif; color: #132b3e; background: #f5f8fa; }
      body { min-height: 100vh; display: grid; place-items: center; margin: 0; }
      main { width: min(24rem, calc(100vw - 2rem)); padding: 2rem; background: white; border: 1px solid #dce6ec; border-radius: 1rem; box-shadow: 0 8px 32px #10253816; }
      h1 { margin: 0 0 1.5rem; font-size: 1.6rem; }
      label { display: block; margin: 1rem 0 .35rem; font-weight: 650; }
      input { box-sizing: border-box; width: 100%; padding: .8rem; border: 1px solid #6a8291; border-radius: .5rem; font: inherit; }
      button { width: 100%; margin-top: 1.5rem; padding: .85rem; border: 0; border-radius: .5rem; background: #0b5e72; color: white; font: inherit; font-weight: 700; cursor: pointer; }
      button:focus-visible, input:focus-visible { outline: 3px solid #f4b943; outline-offset: 2px; }
      #status { color: #9b1724; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <h1>Iniciar sesión</h1>
      <form id="login-form">
        <label for="username">Usuario</label>
        <input id="username" name="username" autocomplete="username" required>
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button id="submit" type="submit" disabled>Ingresar</button>
      </form>
      <p id="status" role="alert" hidden></p>
    </main>
    <script type="module" src="/bundle.js"></script>
  </body>
</html>
