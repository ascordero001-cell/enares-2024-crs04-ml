name: Stage 04 shadow preparation

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Approved release identity
        required: true
        type: string
      run_id:
        description: Approved run identity
        required: true
        type: string
      aggregate_sha256:
        description: SHA-256 of the manually authorized aggregate
        required: true
        type: string
      manifest_sha256:
        description: SHA-256 of the matching manifest
        required: true
        type: string
      parent_sha256:
        description: SHA-256 of the approved V0 parent
        required: true
        type: string
      expected_row_count:
        description: Approved aggregate row count
        required: true
        type: number
      expected_indicator_count:
        description: Approved distinct indicator count
        required: true
        type: number
      decision_reference:
        description: Immutable GitHub review or decision URL
        required: true
        type: string
      decision_commit:
        description: Full commit SHA containing the decision record
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare-private-input:
    name: Verify manually staged private aggregate
    runs-on: [self-hosted, Windows, X64, stage04-private-input]
    timeout-minutes: 10

    steps:
      - name: Check out exact requested commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Require an ephemeral per-run input
        shell: pwsh
        run: |
          $inputDirectory = Join-Path $env:RUNNER_TEMP "stage04-private-input"
          $manifestPath = Join-Path $inputDirectory "manifest.json"
          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
            Write-Error "::error::No matching per-run manifest was staged by the approved local runner hook."
            exit 1
          }

          $manifest = Get-Content -LiteralPath $manifestPath -Raw -Encoding UTF8 | ConvertFrom-Json
          $fileName = [string]$manifest.file_name
          if (-not $fileName.EndsWith(".csv", [StringComparison]::OrdinalIgnoreCase) -or
              [IO.Path]::GetFileName($fileName) -ne $fileName) {
            Write-Error "::error::The manifest file_name is not a safe CSV basename."
            exit 1
          }
          $aggregatePath = Join-Path $inputDirectory $fileName
          if (-not (Test-Path -LiteralPath $aggregatePath -PathType Leaf)) {
            Write-Error "::error::No authorized per-run aggregate was staged by the approved local runner hook."
            exit 1
          }
          "STAGE04_AGGREGATE_PATH=$aggregatePath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "STAGE04_MANIFEST_PATH=$manifestPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build immutable run contract
        shell: pwsh
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          RUN_ID: ${{ inputs.run_id }}
          AGGREGATE_SHA256: ${{ inputs.aggregate_sha256 }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          PARENT_SHA256: ${{ inputs.parent_sha256 }}
          EXPECTED_ROW_COUNT: ${{ inputs.expected_row_count }}
          EXPECTED_INDICATOR_COUNT: ${{ inputs.expected_indicator_count }}
          DECISION_REFERENCE: ${{ inputs.decision_reference }}
          DECISION_COMMIT: ${{ inputs.decision_commit }}
        run: |
          if ($env:DECISION_COMMIT -notmatch '^[0-9a-fA-F]{40}$') {
            throw "decision_commit must be a full commit SHA"
          }
          git merge-base --is-ancestor $env:DECISION_COMMIT $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) {
            throw "decision_commit is not an ancestor of the dispatched commit"
          }
          $decisionDocument = git show "$($env:DECISION_COMMIT):docs/stage04/sprint043_stage2_input_contract.md"
          if (-not ($decisionDocument -join "`n").Contains($env:DECISION_REFERENCE)) {
            throw "decision_reference is not present in the versioned decision commit"
          }
          $payload = @{
            release_id = $env:RELEASE_ID
            run_id = $env:RUN_ID
            aggregate_sha256 = $env:AGGREGATE_SHA256
            manifest_sha256 = $env:MANIFEST_SHA256
            parent_sha256 = $env:PARENT_SHA256
            expected_row_count = [int]$env:EXPECTED_ROW_COUNT
            expected_indicator_count = [int]$env:EXPECTED_INDICATOR_COUNT
            decision_reference = $env:DECISION_REFERENCE
            decision_commit = $env:DECISION_COMMIT
          } | ConvertTo-Json
          $target = Join-Path $env:RUNNER_TEMP "stage04-run-contract.json"
          [IO.File]::WriteAllText($target, $payload, [Text.UTF8Encoding]::new($false))

      - name: Verify provenance and row contracts
        env:
          PYTHONPATH: src
        run: |
          python scripts/prepare_stage04_shadow_run.py `
            --contract (Join-Path $env:RUNNER_TEMP "stage04-run-contract.json") `
            --aggregate $env:STAGE04_AGGREGATE_PATH `
            --manifest $env:STAGE04_MANIFEST_PATH `
            --approval-registry docs/stage04/v0_drive_hash_manifest.md `
            --output-directory (Join-Path $env:RUNNER_TEMP "stage04-safe-evidence")

      - name: Upload redacted evidence only
        uses: actions/upload-artifact@v7
        with:
          name: stage04-preparation-${{ github.run_id }}
          path: ${{ runner.temp }}/stage04-safe-evidence/
          retention-days: 7
          if-no-files-found: error

      - name: Confirm stop before cloud mutation
        run: echo "Prepared evidence only; no load, query, promotion, IAM, traffic or publication."
