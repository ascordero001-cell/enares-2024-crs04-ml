name: Documented quickstart CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  documented-quickstart:
    name: Clean-runner quickstart
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository on a clean runner
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Execute commands extracted from the quickstart
        run: >-
          python scripts/run_documented_quickstart.py
          docs/stage04/demo_local_quickstart.md
          --block quickstart-ci
