[mypy]
python_version = 3.12
mypy_path = src
follow_imports = skip
disable_error_code = import-untyped
check_untyped_defs = True
no_implicit_optional = True
warn_unused_ignores = True

[mypy-enares.stage04.repository]
disallow_untyped_defs = True

[mypy-enares.stage04.repository_cache]
disallow_untyped_defs = True
