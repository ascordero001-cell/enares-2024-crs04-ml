name: PR155 upload-artifact v7 smoke

on:
  pull_request:

permissions:
  contents: read

jobs:
  upload-windows:
    if: github.event.pull_request.number == 155
    runs-on: [self-hosted, Windows, X64, stage04-private-input]
    timeout-minutes: 10

    outputs:
      expected-sha256: ${{ steps.create.outputs.sha256 }}

    steps:
      - name: Create synthetic evidence
        id: create
        shell: powershell
        run: |
          $directory = Join-Path $env:RUNNER_TEMP "pr155-v7-smoke"
          New-Item -ItemType Directory -Force -Path $directory | Out-Null

          $file = Join-Path $directory "evidence.txt"
          "synthetic-only; pr=155; run=$env:GITHUB_RUN_ID" |
            Set-Content -LiteralPath $file -Encoding utf8

          $sha256 = (
            Get-FileHash -LiteralPath $file -Algorithm SHA256
          ).Hash.ToLowerInvariant()

          [System.IO.File]::AppendAllText(
            $env:GITHUB_OUTPUT,
            "sha256=$sha256`n",
            [System.Text.UTF8Encoding]::new($false)
          )
          "Created synthetic evidence with SHA256=$sha256"

      - name: Upload synthetic evidence with v7
        uses: actions/upload-artifact@v7
        with:
          name: pr155-upload-v7-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/pr155-v7-smoke/evidence.txt
          retention-days: 1
          if-no-files-found: error

  verify-download:
    needs: upload-windows
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download uploaded artifact
        uses: actions/download-artifact@v8
        with:
          name: pr155-upload-v7-smoke-${{ github.run_id }}
          path: downloaded

      - name: Verify content and SHA256
        shell: bash
        env:
          EXPECTED_SHA256: ${{ needs.upload-windows.outputs.expected-sha256 }}
        run: |
          test -f downloaded/evidence.txt
          grep -F "synthetic-only; pr=155" downloaded/evidence.txt
          actual_sha256="$(sha256sum downloaded/evidence.txt | awk '{print $1}')"
          test "$actual_sha256" = "$EXPECTED_SHA256"
          echo "Artifact downloaded and verified: $actual_sha256"
